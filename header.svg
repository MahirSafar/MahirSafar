<svg width="100%" height="220" viewBox="0 0 1000 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="40%" stop-color="#0d1224" />
      <stop offset="80%" stop-color="#140f2d" />
      <stop offset="100%" stop-color="#08182b" />
    </linearGradient>

    <!-- Animated Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF">
        <animate attributeName="stop-color" values="#00F5FF;#7C3AED;#10B981;#00F5FF" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED;#10B981;#00F5FF;#7C3AED" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00F5FF">
        <animate attributeName="stop-color" values="#00F5FF;#7C3AED;#10B981;#00F5FF" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Animated Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF">
        <animate attributeName="stop-color" values="#FFFFFF;#00F5FF;#C084FC;#FFFFFF" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="45%" stop-color="#00F5FF">
        <animate attributeName="stop-color" values="#00F5FF;#C084FC;#38BDF8;#00F5FF" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="85%" stop-color="#A78BFA">
        <animate attributeName="stop-color" values="#A78BFA;#38BDF8;#FFFFFF;#A78BFA" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#FFFFFF;#00F5FF;#38BDF8" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowDot" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 46px;
      font-weight: 900;
      letter-spacing: 1px;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 15px;
      font-weight: 500;
      fill: #94A3B8;
      letter-spacing: 0.5px;
    }
    .sub-highlight {
      fill: #00F5FF;
      font-weight: 700;
    }
    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .mono-text {
      font-family: 'Fira Code', Consolas, Monaco, monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #94A3B8;
    }
  </style>

  <!-- Background Card -->
  <rect x="2" y="2" width="996" height="216" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Ambient Glow Spots -->
  <circle cx="200" cy="50" r="90" fill="#00F5FF" opacity="0.06" filter="url(#glowCyan)">
    <animate attributeName="opacity" values="0.04;0.09;0.04" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="820" cy="160" r="110" fill="#7C3AED" opacity="0.08" filter="url(#glowCyan)">
    <animate attributeName="opacity" values="0.06;0.12;0.06" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- Top Status Badge -->
  <g transform="translate(36, 24)">
    <rect x="0" y="0" width="310" height="26" rx="13" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#10B981" filter="url(#glowDot)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="26" y="17" fill="#10B981" class="tag-text" font-size="11" font-weight="700">AVAILABLE FOR ARCHITECTURAL ROLES</text>
  </g>

  <!-- Top Tech Tags (Right Side) -->
  <g transform="translate(680, 24)">
    <rect x="0" y="0" width="64" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1" />
    <text x="10" y="16" class="mono-text">.NET 10</text>

    <rect x="72" y="0" width="58" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1" />
    <text x="82" y="16" class="mono-text">C# 13</text>

    <rect x="138" y="0" width="86" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1" />
    <text x="146" y="16" class="mono-text">PostgreSQL</text>

    <rect x="232" y="0" width="56" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1" />
    <text x="240" y="16" class="mono-text">Docker</text>
  </g>

  <!-- Main Name Title -->
  <text x="36" y="112" fill="url(#textGrad)" class="title-text">MAHIR SAFAROV</text>

  <!-- Subtitle -->
  <text x="36" y="142" class="sub-text">
    <tspan class="sub-highlight">Software Engineer</tspan> • Architecting High-Throughput Modular Monoliths &amp; Distributed Backends
  </text>

  <!-- Bottom Metric Badges -->
  <g transform="translate(36, 172)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="168" height="28" rx="6" fill="#00F5FF" fill-opacity="0.1" stroke="#00F5FF" stroke-opacity="0.4" stroke-width="1" />
    <text x="12" y="18" fill="#00F5FF" class="tag-text">🚀 117+ Production APIs</text>

    <!-- Pill 2 -->
    <rect x="178" y="0" width="186" height="28" rx="6" fill="#7C3AED" fill-opacity="0.12" stroke="#7C3AED" stroke-opacity="0.4" stroke-width="1" />
    <text x="190" y="18" fill="#C084FC" class="tag-text">🏛️ Modular Monolith &amp; DDD</text>

    <!-- Pill 3 -->
    <rect x="374" y="0" width="162" height="28" rx="6" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-opacity="0.4" stroke-width="1" />
    <text x="386" y="18" fill="#34D399" class="tag-text">🧪 234+ Passing Tests</text>

    <!-- Pill 4 -->
    <rect x="546" y="0" width="144" height="28" rx="6" fill="#7C3AED" fill-opacity="0.12" stroke="#7C3AED" stroke-opacity="0.4" stroke-width="1" />
    <text x="558" y="18" fill="#C084FC" class="tag-text">☕ 8 Microservices</text>

    <!-- Pill 5 -->
    <rect x="700" y="0" width="154" height="28" rx="6" fill="#00F5FF" fill-opacity="0.1" stroke="#00F5FF" stroke-opacity="0.4" stroke-width="1" />
    <text x="712" y="18" fill="#38BDF8" class="tag-text">🔒 PostgreSQL RLS</text>
  </g>
</svg>
